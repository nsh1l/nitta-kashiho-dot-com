name: Deploy production site

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "本番サイトにデプロイします。「deploy」と入力してください"
        required: true
        default: ""
  push:
    branches: [main]
    paths-ignore:
      - "_site/**"

env:
  BUN_INSTALL: /home/nsh1l/.bun
  PATH: /home/nsh1l/.bun/bin:/usr/local/bin:/usr/bin:/bin

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.confirm == 'deploy'
    steps:
      - name: Checkout repository
        run: git clone --depth=1 "http://localhost:3000/nsh1l/nitta-kashiho-dot-com.git" repo
      - name: Install dependencies
        working-directory: repo
        run: bun install --frozen-lockfile
      - name: Build site
        working-directory: repo
        run: bun run deploy
      - name: Deploy to production
        working-directory: repo
        run: |
          ssh -p 10022 nittakashiho@nitta-kashiho.com \
            'mkdir -p /home/nittakashiho/backups && tar -C /home/nittakashiho/nitta-kashiho.com/public_html --exclude=./dev --exclude=./new --exclude=./legacy --exclude=./old -czf /home/nittakashiho/backups/nitta-kashiho-public_html-$(date +%Y%m%d-%H%M%S).tar.gz .'
          rsync -az --delete \
            --exclude='/dev/' \
            --exclude='/new/' \
            --exclude='/legacy/' \
            --exclude='/old/' \
            -e 'ssh -p 10022' \
            _site/ \
            nittakashiho@nitta-kashiho.com:/home/nittakashiho/nitta-kashiho.com/public_html/
      - name: Deploy mirror to new subdomain with 301 redirect
        working-directory: repo
        run: |
          cp src/_htaccess-redirect _site/.htaccess
          rsync -az --delete -e 'ssh -p 10022' \
            _site/ \
            nittakashiho@nitta-kashiho.com:/home/nittakashiho/nitta-kashiho.com/public_html/new/
      - name: Deploy dev subdomain with 301 redirect
        working-directory: repo
        run: |
          cp src/_htaccess-redirect _site/.htaccess
          rsync -az --delete -e 'ssh -p 10022' \
            _site/ \
            nittakashiho@nitta-kashiho.com:/home/nittakashiho/nitta-kashiho.com/public_html/dev/
