name: Deploy production site

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "本番サイトにデプロイします。「deploy」と入力してください"
        required: true
        default: ""


env:
  BUN_INSTALL: /home/nsh1l/.bun
  PATH: /home/nsh1l/.bun/bin:/usr/local/bin:/usr/bin:/bin

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'deploy'
    steps:
      - name: Checkout repository
        run: git clone --depth=1 "http://localhost:3000/nsh1l/nitta-kashiho-dot-com.git" repo
      - name: Install dependencies
        working-directory: repo
        run: bun install --frozen-lockfile
      - name: Verify font build dependency
        run: python3 -c 'import fontTools; print(fontTools.__version__)'
      - name: Build site
        working-directory: repo
        run: bun run deploy
      - name: Deploy to production
        working-directory: repo
        run: |
          ssh -p 10022 nittakashiho@nitta-kashiho.com \
            'set -eu; mkdir -p /home/nittakashiho/backups; backup=/home/nittakashiho/backups/nitta-kashiho-public_html-$(date +%Y%m%d-%H%M%S).tar.gz; tar -C /home/nittakashiho/nitta-kashiho.com/public_html --exclude=./dev --exclude=./new --exclude=./legacy --exclude=./old -czf "$backup" .; tar -tzf "$backup" >/dev/null; printf "Verified backup: %s\n" "$backup"'
          rsync -az --delete \
            --exclude='/dev/' \
            --exclude='/new/' \
            --exclude='/legacy/' \
            --exclude='/old/' \
            -e 'ssh -p 10022' \
            _site/ \
            nittakashiho@nitta-kashiho.com:/home/nittakashiho/nitta-kashiho.com/public_html/
