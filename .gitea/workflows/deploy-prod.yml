name: Deploy production site

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "本番サイトにデプロイします。「deploy」と入力してください"
        required: true
        default: ""

env:
  BUN_INSTALL: /home/nsh1l/.bun
  PATH: /home/nsh1l/.bun/bin:/usr/local/bin:/usr/bin:/bin

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'deploy'
    steps:
      - name: Checkout repository
        run: git clone --depth=1 "http://localhost:3000/nsh1l/nitta-kashiho-dot-com.git" repo
      - name: Install dependencies
        working-directory: repo
        run: bun install --frozen-lockfile
      - name: Build site
        working-directory: repo
        run: bun run deploy
      - name: Deploy to production
        working-directory: repo
        run: |
          rsync -az --delete \
            --exclude='/dev/' \
            --exclude='/new/' \
            --exclude='/legacy/' \
            --exclude='/old/' \
            -e 'ssh -p 10022' \
            _site/ \
            nittakashiho@nitta-kashiho.com:/home/nittakashiho/nitta-kashiho.com/public_html/
