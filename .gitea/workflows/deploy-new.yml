name: Deploy new site mirror

on:
  workflow_dispatch:

env:
  BUN_INSTALL: /home/nsh1l/.bun
  PATH: /home/nsh1l/.bun/bin:/usr/local/bin:/usr/bin:/bin

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        run: |
          git clone --depth=1 "http://localhost:3000/nsh1l/nitta-kashiho-dot-com.git" repo
      - name: Install dependencies
        working-directory: repo
        run: bun install --frozen-lockfile
      - name: Build site
        working-directory: repo
        run: bun run deploy
      - name: Deploy mirror to new subdomain with 301 redirect
        working-directory: repo
        run: |
          cp src/_htaccess-redirect _site/.htaccess
          rsync -az --delete -e 'ssh -p 10022' \
            _site/ \
            nittakashiho@nitta-kashiho.com:/home/nittakashiho/nitta-kashiho.com/public_html/new/
      - name: Deploy to dev subdomain with 301 redirect
        working-directory: repo
        run: |
          cp src/_htaccess-redirect _site/.htaccess
          rsync -az --delete -e 'ssh -p 10022' \
            _site/ \
            nittakashiho@nitta-kashiho.com:/home/nittakashiho/nitta-kashiho.com/public_html/dev/
