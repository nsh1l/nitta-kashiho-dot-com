name: CI

on:
  push:
    branches: [main]

env:
  BUN_INSTALL: /home/nsh1l/.bun
  PATH: /home/nsh1l/.bun/bin:/home/nsh1l/.local/bin:/usr/local/bin:/usr/bin:/bin

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        run: git clone --depth=1 "http://localhost:3000/nsh1l/nitta-kashiho-dot-com.git" repo
      - name: Install dependencies
        working-directory: repo
        run: bun install --frozen-lockfile
      - name: Build
        working-directory: repo
        run: bun run deploy
